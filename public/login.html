<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SkillSphere</title>
  <meta name="description" content="Log in to your SkillSphere account to continue your learning journey." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🚀</div>
      <div class="auth-logo-text">SkillSphere</div>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to continue your learning journey</p>

    <div id="alert" class="alert"></div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" style="padding-right:3rem" />
        <button type="button" class="pw-toggle" onclick="togglePassword()" aria-label="Toggle password" id="toggleBtn">
          <span id="eyeIcon">👁️</span>
        </button>
      </div>
    </div>

    <button onclick="login()" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem" id="loginBtn">
      Log In
    </button>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign up free</a>
    </div>

    <div style="margin-top:1.5rem;text-align:center">
      <a href="index.html" style="color:var(--text-muted);font-size:0.85rem;transition:var(--transition)">← Back to home</a>
    </div>
  </div>
</div>

<script>
  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = `alert alert-${type} show`;
    setTimeout(() => { el.className = 'alert'; }, 5000);
  }

  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = '🙈';
    } else {
      input.type = 'password';
      icon.textContent = '👁️';
    }
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    if (!email || !password) return showAlert('Please enter both email and password.', 'error');

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      console.log("LOGIN RESPONSE:", data);
      console.log("TOKEN:", data.token);

      if (!res.ok) {
        showAlert(data.error || 'Login failed. Please check your credentials.', 'error');
        btn.disabled = false;
        btn.textContent = 'Log In';
        return;
      }
      localStorage.setItem('ss_token', data.token);
      console.log("SAVED TOKEN:", localStorage.getItem('ss_token'));
      localStorage.setItem('ss_user', JSON.stringify(data.user));
      showAlert('Welcome back! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    } catch (e) {
      showAlert('Network error. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.addEventListener('DOMContentLoaded', () => { document.getElementById('email').focus(); });
</script>
</body>
</html>
